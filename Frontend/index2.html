<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Market</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <span>M</span>
            MiniMarket
        </div>

        <div class="user">
            <div class="avatar">U</div>

            <div>
                <b id="userName">User</b>
                <small id="userEmail">user@email.com</small>
            </div>

            <button id="logoutBtn">Logout</button>
        </div>
    </header>


    <main>

        <section class="hero">

            <div>
                <small>SELL • MANAGE • GROW</small>

                <h1>
                    Everything you sell,
                    <span>in one place.</span>
                </h1>

                <p>
                    Create and manage your marketplace products easily.
                </p>
            </div>

            <button id="addBtn" class="primary">
                + Add Product
            </button>

        </section>


        <section class="stats">

            <div>
                <small>Total Products</small>
                <b id="total">0</b>
            </div>

            <div>
                <small>Average Price</small>
                <b id="average">Rs. 0</b>
            </div>

            <div>
                <small>Account</small>
                <b>Active</b>
            </div>

        </section>


        <section class="products">

            <div class="top">

                <div>
                    <small>YOUR MARKETPLACE</small>
                    <h2>Products</h2>
                </div>

                <div>
                    <input id="search" type="search" placeholder="Search product...">

                    <button id="refresh">↻</button>
                </div>

            </div>

            <div id="productList" class="grid"></div>

        </section>

    </main>


    <!-- PRODUCT MODAL -->

    <div id="modal" class="modal hidden">

        <div class="box">

            <button id="close" class="close">×</button>

            <small>PRODUCT MANAGEMENT</small>

            <h2 id="modalTitle">Add Product</h2>

            <form id="productForm">

                <input id="title" type="text" placeholder="Product name" required>

                <div class="two">

                    <input id="price" type="number" placeholder="Price" required>

                    <input id="category" type="text" placeholder="Category" required>

                </div>

                <input id="image" type="url" placeholder="Image URL">

                <textarea id="description" placeholder="Product description" required></textarea>

                <button class="primary">
                    Save Product
                </button>

            </form>

        </div>

    </div>


    <div id="toast"></div>

    <script src="frontend.js"></script>

</body>

</html>
